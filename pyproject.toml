[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voxel-mapper"
version = "3.1.0"
requires-python = ">=3.11"
dependencies = ["pyproj>=3.6,<4", "shapely>=2,<3", "requests>=2.32,<3"]

[project.optional-dependencies]
train = ["torch>=2.4,<3", "numpy>=1.26,<3", "Pillow>=10,<13"]

[project.scripts]
voxel-mapper = "voxel_mapper.cli:main"
voxel-train-surfaces = "voxel_mapper.train_ground_model:main"

[tool.setuptools.packages.find]
include = ["voxel_mapper*"]
