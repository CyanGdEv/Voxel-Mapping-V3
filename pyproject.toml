[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voxel-mapper"
version = "3.1.0"
requires-python = ">=3.11"
dependencies = ["pyproj>=3.6,<4", "shapely>=2,<3", "requests>=2.32,<3"]

[project.optional-dependencies]
bedrock = ["amulet-core==1.9.49", "amulet-leveldb==1.0.7", "amulet-nbt==2.1.8", "numpy>=1.26,<2"]
gis = ["rasterio>=1.3,<2", "numpy>=1.26,<3", "scipy>=1.11,<2", "laspy>=2.7,<3", "lazrs>=0.8,<1"]
train = ["torch>=2.4,<3", "numpy>=1.26,<3", "Pillow>=10,<13"]
matching = ["opencv-python-headless>=4.10,<5", "Pillow>=10,<13", "rasterio>=1.3,<2", "numpy>=1.26,<3"]

[project.scripts]
voxel-mapper = "voxel_mapper.cli:main"
voxel-train-surfaces = "voxel_mapper.train_ground_model:main"
voxel-package-reviewed-chips = "voxel_mapper.package_reviewed_chips:main"
voxel-pack-multisource = "voxel_mapper.multisource_chips:main"
voxel-recover-chip-georef = "voxel_mapper.recover_chip_georef:main"
voxel-recover-paving-georef = "voxel_mapper.recover_paving_georef:main"
voxel-benchmark-multisource = "voxel_mapper.benchmark_multisource:main"
voxel-predict-surfaces = "voxel_mapper.predict_ground_model:main"

[tool.setuptools.packages.find]
include = ["voxel_mapper*"]
