name: Alton Towers Wicker Man planning test
# Recover missing official sections alongside cached drawing evidence.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/alton-generation-test.yml
permissions:
  contents: read
jobs:
  alton-world:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install drawing inspection tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils tesseract-ocr tesseract-ocr-eng
      - name: Install generator and planning renderer
        run: python -m pip install '.[planning]'
        env:
          CC: gcc
          CXX: g++
      - name: Generate Wicker Man area and check SW8 planning geometry
        run: python -m voxel_mapper.wickerman --output alton-test
      - name: Summarise actual planning geometry usage
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = Path('alton-test/quality-report.json')
          if report.exists():
              data = json.loads(report.read_text())
              acceptance = Path('alton-test/wicker-man-acceptance.json')
              if acceptance.exists():
                  result = json.loads(acceptance.read_text())
                  print(json.dumps(result, indent=2))
                  with open(__import__('os').environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
                      summary.write('Wicker Man planning test: '+result['status']+'\n\n')
                      registration = result.get('registration', {})
                      summary.write('Drawing alignment: '+registration.get('status', 'not_run')+'; verified: '+str(registration.get('registration_verified', False))+'\n\n')
                      track = result.get('track_association', {})
                      summary.write('Track profile: '+track.get('profile_status', track.get('status', 'not_run'))+'; ambiguous labels: '+str(track.get('ambiguous_bindings', 'unknown'))+'\n\n')
                      summary.write('| Detail | Drawing annotations | Rendered components | Status |\n| --- | ---: | ---: | --- |\n')
                      for check in result['checks']:
                          summary.write('| {category} | {drawing_annotation_candidates} | {rendered_verified_components} | {status} |\n'.format(**check))
              else:
                  print('No Wicker Man acceptance report: generation/inspection failed before the planning gate.')
          else:
              print('Generation did not reach quality-report output; inspect acquisition.json and job logs.')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alton-generation-test-${{ github.run_id }}
          path: alton-test/
          if-no-files-found: warn
          retention-days: 14
