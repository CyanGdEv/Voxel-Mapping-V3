permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install source and CPU packaging runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install '.[planning,desktop]' 'pyinstaller==6.16.0'
      - name: Test desktop and neural runtime
        run: |
          python -m unittest discover -s tests -p 'test_desktop*.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Desktop runtime tests failed' }
          python -m unittest discover -s tests -p 'test_study_component_learning.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Source-crop component recognizer tests failed' }
          python -m unittest discover -s tests -p 'test_study_vision_network.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'CPU convolutional network checks failed' }
          python -m unittest discover -s tests -p 'test_study_vision_learning.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Source-separated component mask learning checks failed' }
          python -m unittest discover -s tests -p 'test_study_context_network.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Global context network checks failed' }
          python -m unittest discover -s tests -p 'test_study_context_learning.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Source-separated context mask learning checks failed' }
          python -m unittest discover -s tests -p 'test_study_pretrained_encoder.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Pinned CPU pretrained encoder checks failed' }
          python -m unittest discover -s tests -p 'test_study_transfer_learning.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Source-separated pretrained vision head checks failed' }
          python -m unittest discover -s tests -p 'test_study_training_coverage.py' -v
          python -m unittest discover -s tests -p 'test_study_intake.py' -v
          python -m unittest discover -s tests -p 'test_study_raster_sources.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Original raster source checks failed' }
          python -m unittest discover -s tests -p 'test_study_site_transfer.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Site-isolated transfer checks failed' }
          python -m unittest discover -s tests -p 'test_ride_training.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Ride component training checks failed' }
          python -m unittest discover -s tests -p 'test_ride_geometry_evidence.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Independent study training coverage checks failed' }
          python -m unittest discover -s tests -p 'test_retained_study_examples.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Retained source target adapter tests failed' }
          python -m unittest discover -s tests -p 'test_study_dataset.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Source-paired study dataset tests failed' }
          python -m unittest discover -s tests -p 'test_neural_learning.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Neural learning tests failed' }
          python -m unittest discover -s tests -p 'test_research_sources.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Broader public source research checks failed' }
          python -m unittest discover -s tests -p 'test_aerial_semantic_learning.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'RGB aerial semantic learning checks failed' }
          python -m unittest discover -s tests -p 'test_paving_masks.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Source-pinned binary paving mask checks failed' }
          python -m unittest discover -s tests -p 'test_imagery_geometry_research.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Imagery gap geometry checks failed' }
          python -m unittest discover -s tests -p 'test_colour_materials.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Colour material assignment checks failed' }
          python -m unittest discover -s tests -p 'test_aerial_material_research.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Aerial RGB material candidate checks failed' }
          python -m unittest discover -s tests -p 'test_map_planning_research.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Map-guided planning research checks failed' }
          python -m unittest discover -s tests -p 'test_research_learning_cycle.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Adaptive research learning checks failed' }
          python -m unittest discover -s tests -p 'test_local_reasoning.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Local reasoning tests failed' }
          python -m unittest discover -s tests -p 'test_web*.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Web evidence and reasoning tests failed' }
          python -m unittest discover -s tests -p 'test_neural_building_pipeline.py' -v
