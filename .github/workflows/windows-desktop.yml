name: Windows desktop executable

on:
  workflow_dispatch:
    inputs:
      include_ocr_tools:
        description: Bundle optional Tesseract and Poppler helpers
        type: boolean
        default: true
  pull_request:
    paths:
      - 'voxel_mapper/desktop_*.py'
      - 'examples/desktop/**'
      - 'examples/alton-world-pilot*.json'
      - 'examples/wicker-component-review*.json'
      - 'examples/wicker-area-navigation-config.json'
      - 'examples/wicker-planning-paving-joins-*-job.json'
      - 'examples/wicker-evidence-acquisition-catalogue.json'
      - 'docs/evidence/world-pilot/**'
      - 'docs/evidence/smiler-review/**'
      - 'docs/evidence/pilot-review/**'
      - 'docs/evidence/site-context/**'
      - 'docs/evidence/planning-surfaces/**'
      - 'evidence/wicker-shop-*.json'
      - 'voxel_mapper/neural_learning.py'
      - 'voxel_mapper/local_reasoning.py'
      - 'voxel_mapper/web_*.py'
      - 'voxel_mapper/reconstruction_benchmark.py'
      - 'voxel_mapper/building_corrections.py'
      - 'voxel_mapper/planning_area_pilot.py'
      - 'voxel_mapper/planning_collection.py'
      - 'voxel_mapper/planning_view_geometry.py'
      - 'voxel_mapper/planning_outline_semantics.py'
      - 'voxel_mapper/planning_component_footprints.py'
      - 'voxel_mapper/planning_component_measurements.py'
      - 'voxel_mapper/planning_section_profiles.py'
      - 'voxel_mapper/planning_section_correspondence.py'
      - 'voxel_mapper/planning_section_cuts.py'
      - 'voxel_mapper/planning_design_dimensions.py'
      - 'voxel_mapper/planning_design_massing.py'
      - 'voxel_mapper/glyph_visibility.py'
      - 'voxel_mapper/drawing_view_candidates.py'
      - 'voxel_mapper/ordinary_surfaces.py'
      - 'voxel_mapper/architectural_view_layout.py'
      - 'voxel_mapper/building_pdf_discovery.py'
      - 'scripts/windows_desktop_entry.py'
      - 'packaging/**'
      - 'tests/test_desktop*.py'
      - 'tests/test_neural_learning.py'
      - 'tests/test_web*.py'
      - 'tests/test_planning_collection.py'
      - 'tests/test_planning_view_geometry.py'
      - 'tests/test_planning_outline_semantics.py'
      - 'tests/test_planning_component_footprints.py'
      - 'tests/test_planning_component_measurements.py'
      - 'tests/test_planning_section_profiles.py'
      - 'tests/test_planning_section_correspondence.py'
      - 'tests/test_planning_section_cuts.py'
      - 'tests/test_planning_design_dimensions.py'
      - 'tests/test_planning_design_massing.py'
      - 'tests/test_design_glyph_visibility.py'
      - 'tests/test_glyph_visibility.py'
      - 'tests/test_drawing_view_candidates.py'
      - 'tests/test_planning_surface_outlines.py'
      - 'tests/test_neural_building_pipeline.py'
      - 'tests/test_reconstruction_benchmark.py'
      - 'tests/test_building_corrections.py'
      - 'pyproject.toml'
      - '.github/workflows/windows-desktop.yml'

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install source and CPU packaging runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install '.[planning,desktop]' 'pyinstaller==6.16.0'
      - name: Test desktop and neural runtime
        run: |
          python -m unittest discover -s tests -p 'test_desktop*.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Desktop runtime tests failed' }
          python -m unittest discover -s tests -p 'test_neural_learning.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Neural learning tests failed' }
          python -m unittest discover -s tests -p 'test_local_reasoning.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Local reasoning tests failed' }
          python -m unittest discover -s tests -p 'test_web*.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Web evidence and reasoning tests failed' }
          python -m unittest discover -s tests -p 'test_neural_building_pipeline.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Neural building pipeline tests failed' }
          python -m unittest discover -s tests -p 'test_reconstruction_benchmark.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Reconstruction benchmark tests failed' }
          python -m unittest discover -s tests -p 'test_building_corrections.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Building correction regeneration tests failed' }
          python -m unittest discover -s tests -p 'test_planning_area_pilot.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Planning area pilot tests failed' }
          python -m unittest discover -s tests -p 'test_planning_collection.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Durable planning collection tests failed' }
          python -m unittest discover -s tests -p 'test_planning_view_geometry.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Regional planning geometry tests failed' }
          python -m unittest discover -s tests -p 'test_planning_outline_semantics.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Planning source-label enclosure tests failed' }
          python -m unittest discover -s tests -p 'test_planning_component_footprints.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Fine component boundary recovery tests failed' }
          python -m unittest discover -s tests -p 'test_planning_component_measurements.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Component nominal measurement and size-note tests failed' }
          python -m unittest discover -s tests -p 'test_planning_section_profiles.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Section profile tests failed' }
          python -m unittest discover -s tests -p 'test_planning_section_correspondence.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Section correspondence tests failed' }
          python -m unittest discover -s tests -p 'test_planning_section_cuts.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Original section-cut topology tests failed' }
          python -m unittest discover -s tests -p 'test_planning_design_dimensions.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Original design-dimension text tests failed' }
          python -m unittest discover -s tests -p 'test_planning_design_massing.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Conditional source design massing tests failed' }
          python -m unittest discover -s tests -p 'test_design_glyph_visibility.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Design statement source-font visibility tests failed' }
          python -m unittest discover -s tests -p 'test_glyph_visibility.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Existing source-font visibility regressions failed' }
          python -m unittest discover -s tests -p 'test_drawing_view_candidates.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Drawing view layout tests failed' }
          python -m unittest discover -s tests -p 'test_planning_surface_outlines.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Planning closed-outline inventory tests failed' }
          python -m unittest discover -s tests -p 'test_architectural_view_layout.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Drawing caption layout tests failed' }
          python -m unittest discover -s tests -p 'test_building_pdf_discovery.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Original PDF discovery tests failed' }
      - name: Install optional OCR and PDF helpers
        if: ${{ github.event_name == 'pull_request' || inputs.include_ocr_tools }}
        shell: pwsh
        run: |
          choco install tesseract poppler --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Optional OCR/PDF helper installation failed' }
          $ocr = Get-ChildItem 'C:\Program Files\Tesseract-OCR' -Filter tesseract.exe -ErrorAction Stop | Select-Object -First 1
          $pdf = Get-ChildItem 'C:\ProgramData\chocolatey\lib\poppler*' -Filter pdftotext.exe -Recurse -ErrorAction Stop | Select-Object -First 1
          if (-not $ocr -or -not $pdf) { throw 'Installed helper executables were not found' }
          "VOXEL_DESKTOP_OCR_DIR=$($ocr.Directory.FullName)" >> $env:GITHUB_ENV
          $pdfRoot = $pdf.Directory
          if ($pdfRoot.Name -eq 'bin' -and $pdfRoot.Parent.Name -eq 'Library') { $pdfRoot = $pdfRoot.Parent.Parent }
          elseif ($pdfRoot.Name -eq 'bin') { $pdfRoot = $pdfRoot.Parent }
          "VOXEL_DESKTOP_PDF_DIR=$($pdfRoot.FullName)" >> $env:GITHUB_ENV
      - name: Build actual Windows executable and bundled runtime
        run: python -m PyInstaller --noconfirm --clean packaging/voxel_mapper.spec
      - name: Copy editable examples and distribution notes
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ./dist/VoxelMapperV3/examples | Out-Null
          Copy-Item ./examples/desktop ./dist/VoxelMapperV3/examples/desktop -Recurse
          Copy-Item ./packaging/README.txt ./dist/VoxelMapperV3/README.txt
          Copy-Item ./packaging/LICENSES.txt ./dist/VoxelMapperV3/LICENSES.txt
      - name: Smoke test bundled native dependencies
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/desktop-validation | Out-Null
          $helperArgs = @('--check-dependencies')
          if ($env:VOXEL_DESKTOP_OCR_DIR) { $helperArgs += '--require-ocr-tools' }
          & ./dist/VoxelMapperV3/VoxelMapperV3.exe @helperArgs 2>&1 | Tee-Object build/desktop-validation/dependencies.log
          if ($LASTEXITCODE -ne 0) { throw 'Frozen dependency smoke test failed' }
      - name: Smoke test frozen workers, persistent memory and neural learning
        shell: pwsh
        run: |
          & ./dist/VoxelMapperV3/VoxelMapperV3.exe --self-test --workers 2 --data-dir "$env:RUNNER_TEMP/voxel-desktop-smoke" 2>&1 | Tee-Object build/desktop-validation/backend.log
          if ($LASTEXITCODE -ne 0) { throw 'Frozen backend smoke test failed' }
      - name: Construct and capture the real frozen UI
        shell: pwsh
        run: |
          & ./dist/VoxelMapperV3/VoxelMapperV3.exe --data-dir "$env:RUNNER_TEMP/voxel-desktop-ui" --ui-smoke-test build/desktop-validation/ui 2>&1 | Tee-Object build/desktop-validation/ui.log
          if ($LASTEXITCODE -ne 0) { throw 'Frozen UI smoke test failed' }
      - name: Exercise the frozen source and geometry correction window
        shell: pwsh
        run: |
          & ./dist/VoxelMapperV3/VoxelMapperV3.exe --review-smoke-test build/desktop-validation/review-ui 2>&1 | Tee-Object build/desktop-validation/review-ui.log
          if ($LASTEXITCODE -ne 0) { throw 'Frozen geometry review UI smoke test failed' }
      - name: Exercise the frozen correction-to-world desktop workflow
        shell: pwsh
        run: |
          & ./dist/VoxelMapperV3/VoxelMapperV3.exe --correction-smoke-test build/desktop-validation/correction-ui 2>&1 | Tee-Object build/desktop-validation/correction-ui.log
          if ($LASTEXITCODE -ne 0) { throw 'Frozen correction regeneration UI/native world smoke test failed' }
      - name: Exercise frozen planning pilot worker and evidence retention
        shell: pwsh
        run: |
          & ./dist/VoxelMapperV3/VoxelMapperV3.exe --planning-pilot-smoke-test build/desktop-validation/planning-pilot 2>&1 | Tee-Object build/desktop-validation/planning-pilot.log
          if ($LASTEXITCODE -ne 0) { throw 'Frozen planning pilot smoke test failed' }
      - name: Exercise frozen web evidence worker and persistent citations
        shell: pwsh
        run: |
          & ./dist/VoxelMapperV3/VoxelMapperV3.exe --web-smoke-test build/desktop-validation/web-evidence 2>&1 | Tee-Object build/desktop-validation/web-evidence.log
          if ($LASTEXITCODE -ne 0) { throw 'Frozen web evidence smoke test failed' }
      - name: Exercise frozen automatic web PDF planning handoff
        shell: pwsh
        run: |
          & ./dist/VoxelMapperV3/VoxelMapperV3.exe --web-planning-smoke-test build/desktop-validation/web-planning 2>&1 | Tee-Object build/desktop-validation/web-planning.log
          if ($LASTEXITCODE -ne 0) { throw 'Frozen automatic web planning handoff failed' }
      - name: Exercise frozen planning follow-up batches and durable resume
        shell: pwsh
        run: |
          & ./dist/VoxelMapperV3/VoxelMapperV3.exe --planning-collection-smoke-test build/desktop-validation/planning-collection 2>&1 | Tee-Object build/desktop-validation/planning-collection.log
          if ($LASTEXITCODE -ne 0) { throw 'Frozen planning collection follow-up/restart check failed' }
      - name: Write exact build receipt and zip distribution
        shell: pwsh
        run: |
          $root = (Resolve-Path ./dist/VoxelMapperV3).Path
          $files = @(Get-ChildItem $root -File -Recurse | ForEach-Object {
            @{ path = [IO.Path]::GetRelativePath($root, $_.FullName).Replace('\','/'); bytes = $_.Length; sha256 = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant() }
          })
          $receipt = @{ version = 'windows-desktop-build-v1'; commit = (git rev-parse HEAD).Trim(); runner = '${{ runner.os }}'; architecture = 'x64'; python = '3.12'; cpu_only = $true; model_weights_bundled = $false; ocr_helpers_bundled = [bool]($env:VOXEL_DESKTOP_OCR_DIR -and $env:VOXEL_DESKTOP_PDF_DIR); files = $files }
          $receipt | ConvertTo-Json -Depth 8 | Set-Content ./build/desktop-validation/build-receipt.json -Encoding utf8
          Copy-Item ./build/desktop-validation ./dist/VoxelMapperV3/validation -Recurse
          Compress-Archive -Path ./dist/VoxelMapperV3 -DestinationPath ./dist/VoxelMapperV3-Windows-x64.zip -CompressionLevel Optimal
          (Get-FileHash ./dist/VoxelMapperV3-Windows-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant() + '  VoxelMapperV3-Windows-x64.zip' | Set-Content ./dist/VoxelMapperV3-Windows-x64.zip.sha256 -Encoding ascii
      - name: Upload small Windows validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VoxelMapperV3-Windows-validation
          path: |
            build/desktop-validation
            dist/VoxelMapperV3-Windows-x64.zip.sha256
          if-no-files-found: warn
          retention-days: 30
      - name: Upload executable distribution and test evidence
        uses: actions/upload-artifact@v4
        with:
          name: VoxelMapperV3-Windows-x64
          path: |
            dist/VoxelMapperV3-Windows-x64.zip
            dist/VoxelMapperV3-Windows-x64.zip.sha256
            build/desktop-validation
          retention-days: 30
      - name: Retain build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: VoxelMapperV3-Windows-build-failure
          path: |
            build/desktop-validation
            build/voxel_mapper/warn-voxel_mapper.txt
            build/voxel_mapper/xref-voxel_mapper.html
          if-no-files-found: ignore
          retention-days: 14
