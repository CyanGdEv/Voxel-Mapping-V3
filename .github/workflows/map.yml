name: Voxel Mapper 3.1
on:
  workflow_dispatch:
    inputs:
      config:
        description: Repository JSON configuration path
        default: examples/area.json
        required: true
      features:
        description: Optional repository WGS84 GeoJSON path; blank fetches OSM
        default: ''
permissions:
  contents: read
jobs:
  map:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - name: Generate map
        env:
          CONFIG: ${{ inputs.config }}
          FEATURES: ${{ inputs.features }}
        shell: bash
        run: |
          args=(--config "$CONFIG" --output output)
          if [[ -n "$FEATURES" ]]; then args+=(--features "$FEATURES"); fi
          voxel-mapper "${args[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: voxel-map-${{ github.run_id }}
          path: output/
          if-no-files-found: warn
          retention-days: 14
